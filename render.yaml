services:
  - type: web
    name: solex-live
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Renseignées dans le tableau de bord Render (Environment) — voir README
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_KEY
        sync: false
